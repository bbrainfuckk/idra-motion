<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>idra-motion: hello</title>
<!--
  A 10 second example of the idra-motion method: one page, every frame drawn from t.

  BEAT SHEET (seconds)
   0.30  "Every frame"                       black, white words spring up          drone
   1.00  "is a function of time."
   2.45  cut to light: the engine card       code types "seek(t) → frame"          whoosh, key ticks
   2.90  playhead runs, frame counter rolls, the dot moves on its path            pad enters
   5.90  24 frames fly in, a cursor clicks Render at 7.40                         pops, click, riser
   8.00  a black dot floods the frame; wordmark, line, "by IDRA"                  impact, pop
  10.00  end
-->
<style>
  @font-face { font-family: "IDRA"; src: url("/fonts/Inter-opsz.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #000; overflow: hidden; height: 100%; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000;
    font-family: "IDRA", system-ui, sans-serif; color: #1d1d1f; -webkit-font-smoothing: antialiased; }
  #stage * { box-sizing: border-box; }
  .scene, .cam { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .scene { visibility: hidden; }
  .cam { transform-origin: 0 0; }
  .abs { position: absolute; white-space: nowrap; }
  .light { background: #f5f5f7; }
  .card { position: absolute; background: #fff; border-radius: 28px; box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 24px 70px rgba(0,0,0,.12); }
  .caret { display: inline-block; width: 3px; height: 1em; background: currentColor; margin-left: 3px; vertical-align: -0.12em; }
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 12px; height: 72px; padding: 0 40px; border-radius: 999px; background: #000; color: #fff; font-size: 26px; font-weight: 650; }
  .chip { display: inline-flex; align-items: center; height: 46px; padding: 0 20px; border-radius: 999px; background: rgba(116,116,128,.12); font-size: 21px; font-weight: 600; }
  .thumb { position: absolute; width: 196px; height: 110px; border-radius: 14px; background: #fff; box-shadow: 0 10px 30px rgba(0,0,0,.12); overflow: hidden; }
  .thumb i { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #000; }
  .cursor { position: absolute; width: 40px; height: 52px; filter: drop-shadow(0 3px 5px rgba(0,0,0,.3)); transform-origin: 3px 2px; }
</style>
</head>
<body>
<div id="stage">
  <section class="scene" id="s1">
    <div class="abs" id="w1" style="left:0;right:0;top:400px;text-align:center;color:#fff;font-size:110px;font-weight:700;letter-spacing:-0.035em">Every frame</div>
    <div class="abs" id="w2" style="left:0;right:0;top:540px;text-align:center;color:#8e8e93;font-size:64px;font-weight:600;letter-spacing:-0.02em">is a function of time.</div>
  </section>

  <section class="scene light" id="s2"><div class="cam" id="c2">
    <div class="card" style="left:300px;top:250px;width:1320px;height:580px">
      <div class="abs" id="code" style="left:70px;top:70px;font:600 64px/1 ui-monospace,'Cascadia Mono',Consolas,monospace;letter-spacing:-0.02em"></div>
      <div class="abs" style="left:70px;top:190px;font-size:24px;font-weight:600;color:#6e6e73">Same t, same frame. Any order, any worker.</div>
      <div class="abs" id="track" style="left:70px;top:330px;width:740px;height:8px;border-radius:4px;background:#e3e3e8"></div>
      <div class="abs" id="fill" style="left:70px;top:330px;height:8px;border-radius:4px;background:#000;width:0"></div>
      <div class="abs" id="head" style="left:70px;top:318px;width:32px;height:32px;margin-left:-16px;border-radius:50%;background:#000;box-shadow:0 0 0 6px #fff, 0 6px 16px rgba(0,0,0,.25)"></div>
      <div class="abs" id="ticks" style="left:70px;top:372px;width:740px;height:14px"></div>
      <div class="abs" id="clock" style="left:70px;top:420px;font-size:30px;font-weight:650;font-variant-numeric:tabular-nums">t = 0.00 s</div>
      <div class="abs" id="frame" style="left:420px;top:420px;font-size:30px;font-weight:650;color:#6e6e73;font-variant-numeric:tabular-nums">Frame 000</div>
      <div class="abs" style="left:900px;top:70px;width:350px;height:440px;border-radius:22px;background:#f5f5f7;overflow:hidden">
        <svg class="abs" width="350" height="440" style="left:0;top:0"><path id="path" fill="none" stroke="#d1d1d6" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/></svg>
        <div class="abs" id="ball" style="width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#000"></div>
      </div>
    </div>
  </div></section>

  <section class="scene light" id="s3"><div class="cam" id="c3">
    <div id="grid"></div>
    <div class="abs" id="chip3" style="left:0;right:0;top:860px;text-align:center"><span class="chip">4 workers · 60 fps · motion blur · -16 LUFS</span></div>
    <div class="abs" id="pill" style="left:810px;top:470px;width:300px"><span class="pill" id="pillText" style="width:300px">Render</span></div>
    <svg class="cursor" id="cursor" viewBox="0 0 17 22"><path d="M1.2 1.2v16l4.2-3.9 2.7 6.2 2.5-1.1-2.7-6.1h5.9z" fill="#000" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/></svg>
  </div>
    <div class="abs" id="dot" style="left:960px;top:506px;border-radius:50%;background:#000"></div>
  </section>

  <section class="scene" id="s4">
    <div class="abs" id="mark" style="left:0;right:0;top:390px;text-align:center;color:#fff;font-size:150px;font-weight:750;letter-spacing:-0.045em"></div>
    <div class="abs" id="line4" style="left:0;right:0;top:590px;text-align:center;color:#a1a1a6;font-size:46px;font-weight:600;letter-spacing:-0.015em">Motion graphics, made with code.</div>
    <div class="abs" id="by4" style="left:0;right:0;top:980px;text-align:center;color:#6e6e73;font-size:22px;font-weight:600;letter-spacing:0.02em">by IDRA</div>
  </section>
</div>
<script type="module">
import { clamp, lerp, seg, ease, easeIn, easeOut, spring, rng, vis, tf, cam, typed, letters, $, $$ } from "/engine/motion.js";
import { mix, PROGRESSION } from "/engine/sound.js";
import { film } from "/engine/stage.js";

const DURATION = 10;
const CODE = "seek(t) → frame";
const CODE_AT = 2.95, CODE_CPS = 16;
const RUN = [2.9, 5.85];            // the playhead's run
const CLICK = 7.4;                   // the cursor clicks Render
const FLOOD = 8.0;                   // the black dot floods the frame

// The dot's path in the little preview: a pure function of its own clock.
const PATH = (k) => [175 + 120 * Math.sin(k * Math.PI * 2), 220 + 150 * Math.sin(k * Math.PI * 4) * 0.6 - 60 * Math.cos(k * Math.PI * 2)];
$("#path").setAttribute("d", Array.from({ length: 121 }, (_, i) => PATH(i / 120)).map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`).join(" "));
$("#ticks").innerHTML = Array.from({ length: 11 }, (_, i) => `<i style="position:absolute;left:${i * 74}px;top:0;width:2px;height:${i % 5 ? 8 : 14}px;background:#c7c7cc"></i>`).join("");

// 24 frames of the dot, laid out in a 6 x 4 grid; each arrives on a spring from a seeded offset.
const r = rng(11);
const THUMBS = Array.from({ length: 24 }, (_, i) => {
  const col = i % 6, row = Math.floor(i / 6);
  const k = i / 23, [x, y] = PATH(k);
  return { x: 186 + col * 262, y: 120 + row * 172, at: 5.95 + i * 0.045, dx: (r() - 0.5) * 900, dy: 500 + r() * 400, rot: (r() - 0.5) * 40, bx: 18 + (x / 350) * 160, by: 10 + (y / 440) * 90 };
});
$("#grid").innerHTML = THUMBS.map((th) => `<div class="thumb"><i style="left:${th.bx}px;top:${th.by}px"></i></div>`).join("");
$("#mark").innerHTML = letters("idra-motion");

const E = Object.fromEntries($$("[id]").map((el) => [el.id, el]));
const thumbs = $$(".thumb");
const markLetters = $$("#mark span");

function draw(t) {
  // 1. black, the idea in words
  vis(E.s1, t < 2.6 ? 1 : 0);
  if (t < 2.6) {
    const a = spring(t - 0.3, 12, 0.9), b = spring(t - 1.0, 12, 0.9), out = easeIn(seg(t, 2.25, 2.55));
    E.w1.style.opacity = clamp(a * 1.4) * (1 - out);
    E.w1.style.transform = `translateY(${lerp(50, 0, a) - 40 * out}px) scale(${1 - 0.06 * out})`;
    E.w2.style.opacity = clamp(b * 1.4) * (1 - out);
    E.w2.style.transform = `translateY(${lerp(40, 0, b) - 30 * out}px)`;
  }

  // 2. the engine: code types, the playhead runs, the frame counter rolls, the dot follows its path
  vis(E.s2, t >= 2.45 && t < 6.1 ? 1 : 0);
  if (t >= 2.45 && t < 6.1) {
    const k = spring(t - 2.45, 9, 1);
    cam(E.c2, 960, 540, lerp(1.12, 1, k) * lerp(1, 1.06, easeIn(seg(t, 5.6, 6.1))));
    E.c2.style.opacity = clamp(seg(t, 2.45, 2.6)) * (1 - seg(t, 5.85, 6.1));
    typed(E.code, CODE, t, CODE_AT, CODE_CPS);
    const p = ease(seg(t, RUN[0], RUN[1]));
    E.fill.style.width = `${740 * p}px`;
    E.head.style.left = `${70 + 740 * p}px`;
    const local = p * DURATION;
    E.clock.textContent = `t = ${local.toFixed(2)} s`;
    // The counter and the clock read the same value: frame = time x 30 fps.
    E.frame.textContent = `Frame ${String(Math.min(299, Math.floor(local * 30))).padStart(3, "0")}`;
    const [x, y] = PATH(p);
    tf(E.ball, x, y, 1 + 0.15 * Math.sin(p * Math.PI * 8));
  }

  // 3. many frames at once, then Render
  vis(E.s3, t >= 5.85 && t < 8.4 ? 1 : 0);
  if (t >= 5.85 && t < 8.4) {
    cam(E.c3, 960, 540, lerp(1.04, 1, ease(seg(t, 5.85, 7.0))));
    thumbs.forEach((el, i) => {
      const th = THUMBS[i], k = spring(t - th.at, 13, 0.8);
      el.style.opacity = clamp(k * 2) * (1 - 0.65 * easeOut(seg(t, 6.9, 7.2)));
      tf(el, th.x + th.dx * (1 - k), th.y + th.dy * (1 - k), lerp(0.6, 1, k), th.rot * (1 - k));
    });
    const chip = spring(t - 6.55, 14, 0.85);
    E.chip3.style.opacity = clamp(chip * 1.5);
    E.chip3.style.transform = `translateY(${lerp(30, 0, chip)}px)`;
    const pill = spring(t - 6.95, 16, 0.65), press = CLICK <= t && t < CLICK + 0.16 ? 0.94 : 1;
    E.pill.style.opacity = clamp(pill * 2);
    E.pill.style.transform = `scale(${lerp(0.5, 1, pill) * press})`;
    E.pillText.textContent = t < CLICK + 0.1 ? "Render" : "Rendered ✓";
    const move = ease(seg(t, 6.85, 7.32));
    tf(E.cursor, lerp(1500, 1000, move), lerp(900, 515, move), t >= CLICK && t < CLICK + 0.14 ? 0.85 : 1);
    vis(E.cursor, seg(t, 6.8, 6.95) * (1 - seg(t, 7.85, 8.0)));
    const radius = t < FLOOD ? 0 : 1400 * easeIn(seg(t, FLOOD, FLOOD + 0.38));
    E.dot.style.cssText += `;width:${2 * radius}px;height:${2 * radius}px;margin:${-radius}px 0 0 ${-radius}px`;
    vis(E.dot, radius > 0 ? 1 : 0);
  }

  // 4. the name
  vis(E.s4, t >= 8.3 ? 1 : 0);
  if (t >= 8.3) {
    markLetters.forEach((el, i) => { const k = spring(t - (8.42 + i * 0.03), 15, 0.78); el.style.transform = `translateY(${lerp(80, 0, k)}px)`; el.style.opacity = clamp(k * 1.6); });
    const line = easeOut(seg(t, 8.95, 9.35));
    E.line4.style.opacity = line;
    E.line4.style.transform = `translateY(${lerp(24, 0, line)}px)`;
    E.by4.style.opacity = easeOut(seg(t, 9.3, 9.6));
  }
}

// The soundtrack, from the same times as the picture.
async function sound(ctx) {
  const m = mix(ctx);
  m.drone(0, 2.7);
  await Promise.all([
    m.sfx("whoosh", 2.3, 0.4, 1.1), m.sfx("pop", 2.5, 0.3, 0.9),
    m.keys(CODE_AT, CODE.length, CODE_CPS, 0.2),
    m.sfx("whoosh", 5.8, 0.3, 1.15),
    ...THUMBS.filter((_, i) => i % 3 === 0).map((th, i) => m.sfx("pop", th.at + 0.06, 0.22, 0.9 + i * 0.05)),
    m.sfx("pop", 6.6, 0.3, 1.1), m.sfx("pop", 7.0, 0.35, 0.95),
    m.sfx("click", CLICK, 0.85), m.sfx("pop", CLICK + 0.1, 0.45, 0.75),
    m.sfx("riser", 6.3, 0.32), m.sfx("whoosh", FLOOD, 0.4, 0.8), m.sfx("impact", FLOOD + 0.36, 0.75, 0.82),
    m.sfx("pop", 8.45, 0.4, 0.9)
  ]);
  m.pad(2.55, 2.45, DURATION, PROGRESSION.slice(0, 4));
}

film({ width: 1920, height: 1080, duration: DURATION, draw, sound, fonts: ["400 40px IDRA", "600 40px IDRA", "650 40px IDRA", "700 40px IDRA", "750 40px IDRA"] });
</script>
</body>
</html>
